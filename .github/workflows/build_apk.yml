name: Build Pele Shaon APK

on:
  push:
    branches: [ "main", "ccr-*" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'

      - name: Test zmanim and Shabbat rules
        run: gradle :core:test

      - name: Build Debug APKs (phone and watch)
        run: gradle :app:assembleDebug :wear:assembleDebug

      - name: Upload phone APK
        uses: actions/upload-artifact@v5
        with:
          name: PeleShaon-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload watch APK
        uses: actions/upload-artifact@v5
        with:
          name: PeleShaon-wear-debug
          path: wear/build/outputs/apk/debug/wear-debug.apk

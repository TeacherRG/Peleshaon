name: Build Pele Shaon APK

on:
  push:
    branches: [ "main", "ccr-*" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'

      - name: Test zmanim and Shabbat rules
        run: gradle :core:test

      - name: Build Debug APKs (phone and watch)
        run: gradle :app:assembleDebug :wear:assembleDebug

      - name: Privacy promise — no internet permission
        # Политика конфиденциальности (niflaot.mychitas.app/peleshaon/privacy/) обещает: приложение не выходит в интернет.
        # Если разрешение INTERNET появилось (например, его принесла библиотека) — сначала поправить политику.
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          for apk in app/build/outputs/apk/debug/app-debug.apk wear/build/outputs/apk/debug/wear-debug.apk; do
            echo "== $apk"; "$AAPT" dump permissions "$apk"
            if "$AAPT" dump permissions "$apk" | grep -q 'android.permission.INTERNET'; then
              echo "::error::$apk requests INTERNET — the privacy policy says the app does not go online"; exit 1
            fi
          done

      - name: Widgets are in the APK
        # Виджеты должны быть видны рабочему столу: приёмник exported, с APPWIDGET_UPDATE и описанием виджета.
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$AAPT" dump xmltree "$apk" --file AndroidManifest.xml > manifest.txt
          for w in FaceWidget DateWidget; do
            grep -A12 "live.$w" manifest.txt | tee /dev/stderr | grep -q 'android.appwidget.provider' || { echo "::error::$w is not a widget"; exit 1; }
            grep -A3 "live.$w" manifest.txt | grep -q 'exported.*=true\|exported.*0xffffffff' || { echo "::error::$w is not exported"; exit 1; }
          done
          "$AAPT" dump xmltree "$apk" --file res/xml/widget_face_info.xml || true

      - name: Upload phone APK
        uses: actions/upload-artifact@v5
        with:
          name: PeleShaon-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload watch APK
        uses: actions/upload-artifact@v5
        with:
          name: PeleShaon-wear-debug
          path: wear/build/outputs/apk/debug/wear-debug.apk

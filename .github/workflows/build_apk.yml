name: Build Pele Shaon APK

# Upstream PR validation; preserve the maintainer's original push and PR triggers.
on:
  push:
    branches: [ "main", "ccr-*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      - name: Check source and translation integrity
        run: python3 scripts/check_integrity.py

      # Play upload key (optional). Without these secrets release bundles stay unsigned.
      # Secrets: PELE_UPLOAD_KEYSTORE_BASE64, PELE_UPLOAD_STORE_PASSWORD, PELE_UPLOAD_KEY_ALIAS,
      # PELE_UPLOAD_KEY_PASSWORD — see PLAY_RELEASE.md.
      - name: Restore Play upload key
        env:
          KEYSTORE_B64: ${{ secrets.PELE_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "PELE_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Upload key restored: release bundles will be signed"
          else
            echo "No upload key secret: release bundles stay unsigned"
          fi

      # One Gradle invocation shares dependency resolution and configuration
      # across tests and both APKs, avoiding duplicate runner time.
      - name: Test core and build both Beta APKs
        env:
          PELE_UPLOAD_STORE_PASSWORD: ${{ secrets.PELE_UPLOAD_STORE_PASSWORD }}
          PELE_UPLOAD_KEY_ALIAS: ${{ secrets.PELE_UPLOAD_KEY_ALIAS }}
          PELE_UPLOAD_KEY_PASSWORD: ${{ secrets.PELE_UPLOAD_KEY_PASSWORD }}
        run: gradle --no-daemon :core:test :app:assembleDebug :app:assembleQa :wear:assembleDebug :app:bundleRelease :wear:bundleRelease :wear:assembleRelease

      - name: Validate both phone packages and upgrade version code
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk > /tmp/phone-package.txt
          "$AAPT" dump badging app/build/outputs/apk/qa/app-qa.apk > /tmp/parallel-package.txt
          "$AAPT" dump badging wear/build/outputs/apk/debug/wear-debug.apk > /tmp/wear-package.txt
          echo "== Phone" && head -6 /tmp/phone-package.txt
          echo "== QA parallel" && head -6 /tmp/parallel-package.txt
          echo "== Wear" && head -6 /tmp/wear-package.txt
          grep -q "name='app.niflaot.peleshaon' versionCode='7'" /tmp/phone-package.txt
          grep -q "name='app.niflaot.peleshaon.qa' versionCode='7'" /tmp/parallel-package.txt
          grep -q "name='app.niflaot.peleshaon' versionCode='100007'" /tmp/wear-package.txt
          grep -q "targetSdkVersion:'36'" /tmp/phone-package.txt
          grep -q "targetSdkVersion:'35'" /tmp/wear-package.txt
          grep -q "minSdkVersion:'26'" /tmp/phone-package.txt
          grep -q "minSdkVersion:'26'" /tmp/parallel-package.txt
          echo "Verified: normal update + separate QA install with independent package ID"

      - name: Export exact app engine times for third-party comparison
        uses: actions/upload-artifact@v5
        with:
          name: peleshaon-zmanim-internal-probe
          path: core/build/reports/chabad-engine-probe.tsv
          if-no-files-found: error

      - name: Export full 337-place astronomical audit
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: peleshaon-all-337-zmanim
          path: |
            core/build/reports/all-337-zmanim-by-date.tsv
            core/build/reports/all-337-zmanim-city-summary.tsv
            core/build/reports/all-337-zmanim-audit-summary.txt
          if-no-files-found: warn

      - name: Privacy promise — no internet permission
        # Политика конфиденциальности (niflaot.mychitas.app/peleshaon/privacy/) обещает: приложение не выходит в интернет.
        # Если разрешение INTERNET появилось (например, его принесла библиотека) — сначала поправить политику.
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          for apk in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/qa/app-qa.apk wear/build/outputs/apk/debug/wear-debug.apk; do
            echo "== $apk"; "$AAPT" dump permissions "$apk"
            if "$AAPT" dump permissions "$apk" | grep -q 'android.permission.INTERNET'; then
              echo "::error::$apk requests INTERNET — the privacy policy says the app does not go online"; exit 1
            fi
          done

      - name: Widgets are in the APK
        # Виджеты должны быть видны рабочему столу: приёмник exported, с APPWIDGET_UPDATE и описанием виджета.
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$AAPT" dump xmltree "$apk" --file AndroidManifest.xml > manifest.txt
          for w in FaceWidget DateWidget; do
            grep -A12 "live.$w" manifest.txt | tee /dev/stderr | grep -q 'android.appwidget.provider' || { echo "::error::$w is not a widget"; exit 1; }
            grep -A3 "live.$w" manifest.txt | grep -q 'exported.*=true\|exported.*0xffffffff' || { echo "::error::$w is not exported"; exit 1; }
          done
          "$AAPT" dump xmltree "$apk" --file res/xml/widget_face_info.xml || true

      - name: Report release bundle signing
        run: |
          for aab in app/build/outputs/bundle/release/app-release.aab wear/build/outputs/bundle/release/wear-release.aab; do
            if jarsigner -verify "$aab" 2>&1 | grep -q "jar verified"; then
              echo "SIGNED: $aab"
            else
              echo "UNSIGNED: $aab (add the upload key secrets to sign it for Google Play)"
            fi
          done

      - name: Upload Play App Bundle (phone)
        uses: actions/upload-artifact@v5
        with:
          name: Niflaot-phone-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload Play App Bundle (Wear OS)
        uses: actions/upload-artifact@v5
        with:
          name: Niflaot-wear-release-aab
          path: wear/build/outputs/bundle/release/wear-release.aab

      - name: Upload phone APK
        uses: actions/upload-artifact@v5
        with:
          name: PeleShaon-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload unsigned Wear OS release APK
        uses: actions/upload-artifact@v5
        with:
          name: Niflaot-wear-release-unsigned
          path: wear/build/outputs/apk/release/wear-release-unsigned.apk

      - name: Upload watch APK
        uses: actions/upload-artifact@v5
        with:
          name: PeleShaon-wear-debug
          path: wear/build/outputs/apk/debug/wear-debug.apk

      - name: Upload parallel-install QA APK
        uses: actions/upload-artifact@v5
        with:
          name: PeleShaon-phone-parallel-qa
          path: app/build/outputs/apk/qa/app-qa.apk
